    <!-- Theme Early Boot Script (Prevents Theme Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('xaivon-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "XAIVON",
      "legalName": "ADABHRA GROUP",
      "url": "https://xaivon.com",
      "logo": "https://xaivon.com/logo.png",
      "description": "XAIVON is a business brand operated by ADABHRA GROUP (Sole Proprietorship), India, designing workflow automation, connected systems, and practical AI assistance.",
      "foundingDate": "2026",
      "founder": {
        "@type": "Person",
        "name": "Raja Babu"
      },
      "areaServed": [
        { "@type": "Country", "name": "India" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "Australia" }
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "raja@xaivon.com",
        "telephone": "+91-95211-90205",
        "availableLanguage": "English"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI Business Infrastructure Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Automation" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Chatbots" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Voice Agents" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM Automation" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Logistics & Freight AI" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM, Lead & Data Automation" } }
        ]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "XAIVON",

    }

    <meta name="theme-color" content="#0A0A0A" />

    <!-- Google Analytics 4 Consent Architecture (Strict Opt-In) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
      (function() {
        try {
          var consent = localStorage.getItem('xaivon_cookie_consent');
          if (consent === 'granted') {
            gtag('consent', 'update', { 'analytics_storage': 'granted' });
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=G-FKYVMSFM5B';
            document.head.appendChild(s);
            gtag('js', new Date());
            gtag('config', 'G-FKYVMSFM5B', { send_page_view: false });
          }
        } catch (e) {}
      })();
    </script>
